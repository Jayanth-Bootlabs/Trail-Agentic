[project]
name = "crewai-recipe"
version = "0.1.0"
description = ""
authors = [
    {name = "ShreyeshSwargam98",email = "shreyesh.swargam@bootlabstech.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai (>=1.14.1,<2.0.0)",
    "langchain (>=1.2.15,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "fastapi (>=0.135.3,<0.136.0)",
    "tortoise-orm (>=1.1.7,<2.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "email-validator (>=2.3.0,<3.0.0)",
]

[tool.poetry]
packages = [{include = "crewai_recipe", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
