server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: backend-json-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          __path__: /var/log/backend/backend.jsonl*
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            service: service
            level: level
            event: event
            node: node
            model: model
            tier: tier
            status: status
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          service:
          level:
          event:
          node:
          model:
          tier:
          status:
